    text-transform: uppercase;
    font-size: .72rem;
    color: var(--gold-400);
    font-weight: 600;
  }

  .login-left h1 {
    font-size: clamp(2rem, 4vw, 3.2rem);
    font-weight: 700;
    line-height: 1.15;
    margin: .6rem 0 1rem;
  }

  .login-left p {
    color: #c7cfe3;
    max-width: 520px;
    font-size: 1.02rem;
  }

  .login-right {

    justify-content: center;

    box-shadow: 0 0 0 3px rgba(201, 162, 39, .15);
  }

  .btn-navy {

    border-radius: 10px;

  }

    height: 36px;
    border-radius: 50%;
    background: var(--gold-500);
    color: var(--navy-950);

    justify-content: center;
    font-family: 'Prompt';
    font-weight: 700;
    font-size: .85rem;
    flex-shrink: 0;

    margin-bottom: 1.4rem;

  }

    color: var(--ink-soft);
    font-size: .85rem;
    margin-top: .15rem;
  }

    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--line);
    padding: 1.3rem;
  }

  .view {
    display: none;
  }

  .view.active {
    display: block;
    animation: fadein .25s ease;
  }

  @keyframes fadein {
    from {
      opacity: 0;
      transform: translateY(6px);
    }

    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .mobile-toggle {
    display: none;
  }

  /* ============ RESPONSIVE ============ */
  @media (max-width: 992px) {
    #loginScreen {
      flex-direction: column;
    }

    .login-left {
      padding: 2rem;
      text-align: center;
    }

    .login-left p {
      margin: 0 auto;
    }

    .login-right {
      padding: 2rem;
    }

    .sidebar {
      transform: translateX(-100%);
      transition: .25s;
    }

    .sidebar.open {
      transform: translateX(0);
    }

    .main-area {
      margin-left: 0;
    }

    .mobile-toggle {
      display: inline-flex;
    }
