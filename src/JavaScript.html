  /* ================= THAI DATE UTILITY (พ.ศ. จริง) ================= */
  function toThaiDate(dateInput, withTime) {
    const d = new Date(dateInput);
    if (isNaN(d.getTime())) return "-";
    let text = d.toLocaleDateString("th-TH-u-ca-buddhist", {
      year: "numeric",
      month: "long",
      day: "numeric",
    });
    if (withTime) {
      const time = d.toLocaleTimeString("th-TH", {
        hour: "2-digit",
        minute: "2-digit",
      });
      text += " เวลา " + time + " น.";
    }
    return text;
  }
  function formatTimeDisplay(t) {
    if (!t) return "-";
    if (/^\d{1,2}:\d{2}$/.test(t)) return t;
    const d = new Date(t);
    if (!isNaN(d.getTime())) {
      const h = String(d.getUTCHours()).padStart(2, "0");
      const m = String(d.getUTCMinutes()).padStart(2, "0");
      return h + ":" + m;
    }
    return t;
  }
  function formatDateOnlyThai(v) {
    if (!v) return "-";
    if (typeof v === "string" && /^\d{4}-\d{2}-\d{2}$/.test(v)) {
      const p = v.split("-");
      const th = ["", "ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
      return Number(p[2]) + " " + (th[Number(p[1])] || p[1]) + " " + (Number(p[0]) + 543);
    }
    return toThaiDate(v, false);
  }

  /* ================= SESSION RESTORE ================= */
  document.addEventListener("DOMContentLoaded", function () {
    const savedUser = sessionStorage.getItem("sa_user");
    const savedToken = sessionStorage.getItem("sa_token");

    if (savedUser && savedToken) {
      google.script.run
        .withSuccessHandler(function (session) {
          if (session) {
            currentUser = JSON.parse(savedUser);
            showAppShell_();
          } else {
            sessionStorage.removeItem("sa_token");
            sessionStorage.removeItem("sa_user");
          }
        })
        .withFailureHandler(function () {
          sessionStorage.removeItem("sa_token");
          sessionStorage.removeItem("sa_user");
        })
        .validateSessionFromClient(savedToken);
    }

    document.querySelectorAll(".nav-link-custom").forEach(function (link) {
      link.addEventListener("click", function () {
        switchView(link.dataset.view);
      });
    });
  });

  /* ================= LOGIN ================= */
  function doLogin() {
    var username = document.getElementById("username").value.trim();
    var password = document.getElementById("password").value;
    var errBox = document.getElementById("loginError");
    errBox.classList.add("d-none");

    if (!username || !password) {
      errBox.textContent = "กรุณากรอกชื่อผู้ใช้และรหัสผ่าน";
      errBox.classList.remove("d-none");
      return;
    }

    document.getElementById("loginBtn").disabled = true;
    document.getElementById("loginBtn").textContent = "กำลังเข้าสู่ระบบ...";

    google.script.run
      .withSuccessHandler(onLoginSuccess)
      .withFailureHandler(onLoginFail)
      .handleLoginFromClient(username, password);
  }

  function onLoginSuccess(result) {
    document.getElementById("loginBtn").disabled = false;
    document.getElementById("loginBtn").textContent = "เข้าสู่ระบบ";

    if (!result.success) {
      var errBox = document.getElementById("loginError");
      errBox.textContent = result.message || "เข้าสู่ระบบไม่สำเร็จ";
      errBox.classList.remove("d-none");
      return;
    }

    currentUser = result.user;
    sessionStorage.setItem("sa_token", result.token);
    sessionStorage.setItem("sa_user", JSON.stringify(result.user));

    showAppShell_();

    Swal.fire({
      icon: "success",
      title: "เข้าสู่ระบบสำเร็จ",
      text: "ยินดีต้อนรับ " + currentUser.fullName,
      timer: 1600,
      showConfirmButton: false,
    });
  }

  function onLoginFail(error) {
    document.getElementById("loginBtn").disabled = false;
    document.getElementById("loginBtn").textContent = "เข้าสู่ระบบ";
    var errBox = document.getElementById("loginError");
    errBox.textContent = "เกิดข้อผิดพลาด: " + error.message;
    errBox.classList.remove("d-none");
  }

  /* ================= APP SHELL ================= */
  function showAppShell_() {
    document.getElementById("loginScreen").style.display = "none";
    document.getElementById("appShell").style.display = "block";

    document.getElementById("sbName").textContent = currentUser.fullName;
    document.getElementById("sbRole").textContent = currentUser.roleLabel;
    document.getElementById("sbAvatar").textContent =
      currentUser.fullName.slice(0, 2);

    applyPermissions_();
    loadDashboard();
  }

  function applyPermissions_() {
    document
      .querySelectorAll(".nav-link-custom[data-perm]")
      .forEach(function (link) {
        var perm = link.dataset.perm;
        if (perm && currentUser.permissions && !currentUser.permissions[perm]) {
          link.style.display = "none";
        } else {
          link.style.display = "";
        }
      });
  }

  /* ================= LOGOUT ================= */
  function doLogout() {
    Swal.fire({

      title: "ออกจากระบบ?",
      showCancelButton: true,
      confirmButtonText: "ออกจากระบบ",
      cancelButtonText: "ยกเลิก",
      confirmButtonColor: "#c2483a",
    }).then(function (r) {
      if (r.isConfirmed) {
        sessionStorage.removeItem("sa_token");
        sessionStorage.removeItem("sa_user");
        currentUser = null;
        document.getElementById("appShell").style.display = "none";
        document.getElementById("loginScreen").style.display = "flex";
        document.getElementById("username").value = "";
        document.getElementById("password").value = "";
        document
          .querySelectorAll(".nav-link-custom[data-perm]")
          .forEach(function (link) {
            link.style.display = "";
          });
      }
    });
  }

  function switchView(name) {
    document.querySelectorAll(".view").forEach(function (v) {
      v.classList.remove("active");
    });
    document.getElementById("view-" + name).classList.add("active");
    document.querySelectorAll(".nav-link-custom").forEach(function (l) {
      l.classList.toggle("active", l.dataset.view === name);
    });
    document.getElementById("sidebar").classList.remove("open");

    if (name === "dashboard") loadDashboard();
    if (name === "score") loadScoreHistory();
    if (name === "leave") loadLeaveRequests();
    if (name === "letters") loadLetters();
    if (name === "line") loadLineSettings();
    if (name === "users") {
      loadUsers();
      loadSemesterConfig();
    }
    if (name === "reports") {
      document.getElementById("rp_period").value = "year";
      onReportPeriodChange();
      switchReportSubTab("score");
    }
  }

  function loadStudents() {
    const filters = {
      q: document.getElementById("studentSearch").value,
      grade: document.getElementById("filterGrade").value,
      room: document.getElementById("filterRoom").value,
    };
    document.getElementById("studentTableBody").innerHTML =

      .withSuccessHandler(renderStudentTable)

        Swal.fire({
          icon: "error",
          title: "โหลดข้อมูลไม่สำเร็จ",
          text: err.message,
        }),
      )
      .apiGetStudents(getToken(), filters);
  }

  function renderStudentTable(res) {
    if (!res.success) {
      Swal.fire({ icon: "error", title: "เกิดข้อผิดพลาด", text: res.message });

        '<tr><td colspan="7" class="text-center text-secondary py-4">โหลดข้อมูลไม่สำเร็จ</td></tr>';
      return;
    }
    document.getElementById("studentCount").textContent = res.total + " รายการ";
    const canManage =
      currentUser &&
      currentUser.permissions &&
      currentUser.permissions.editDelete;

    const rows = res.students
      .map((st) => {
        const fullName =
          (st.Prefix || "") + (st.FirstName || "") + " " + (st.LastName || "");
        const actionBtns = `
        <button class="btn btn-outline-secondary" title="ดูรายละเอียด" onclick="event.stopPropagation(); openProfile('${st.StudentID}')"><i class="bi bi-eye"></i></button>
        ${
          canManage
            ? `
        <button class="btn btn-outline-primary" title="แก้ไขข้อมูล" onclick="event.stopPropagation(); openEditStudentModal('${st.StudentID}')"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-outline-danger" title="ลบนักเรียน" onclick="event.stopPropagation(); deleteStudent('${st.StudentID}')"><i class="bi bi-trash"></i></button>`
            : ""
        }
      `;
        return `
      <tr class="student-row" onclick="openProfile('${st.StudentID}')">
        <td>${renderAvatarHtml(st.PhotoFileID, (st.FirstName || "-")[0], "avatar-mini")}</td> 
        <td>${fullName}<div class="text-secondary" style="font-size:.72rem">${st.StudentID}</div></td>
        <td>${st.StudentID}</td>
        <td>${st.Grade || "-"} / ${st.Room || "-"} เลขที่ ${st.No || "-"}</td>
        <td><span class="fw-bold" style="color:${st.CurrentScore < 70 ? "var(--bad)" : "var(--navy-900)"}">${st.CurrentScore}</span></td>
        <td>${st.LineLinked ? '<span class="badge-soft badge-good">เชื่อมแล้ว</span>' : '<span class="badge-soft badge-warn">ยังไม่เชื่อม</span>'}</td>
        <td class="text-end"><div class="action-btn-group">${actionBtns}</div></td>
      </tr>`;
      })
      .join("");
    document.getElementById("studentTableBody").innerHTML =
      rows ||
      '<tr><td colspan="7" class="text-center text-secondary py-4">ไม่พบข้อมูลนักเรียน</td></tr>';
  }

      motherName: "นางสมหญิง ใจดี",
      motherJob: "ค้าขาย",
    };
    const escapeCell = (v) => {
      const s = String(v === undefined || v === null ? "" : v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const headerLine = IMPORT_COLUMNS.map((c) => escapeCell(c.label)).join(",");
    const sampleLine = IMPORT_COLUMNS.map((c) => escapeCell(sampleRow[c.key])).join(",");
    const csv = headerLine + "\n" + sampleLine + "\n";
    const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "เทมเพลตนำเข้านักเรียน.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(a.href);
  }

  function normalizeImportCell(v) {
    if (v === null || v === undefined) return "";
    if (v instanceof Date) {
      return (
        v.getFullYear() +
        "-" +
        String(v.getMonth() + 1).padStart(2, "0") +
        "-" +
        String(v.getDate()).padStart(2, "0")
      );
    }
    if (typeof v === "number" && v > 20000 && v < 60000 && XLSX && XLSX.SSF) {
      const d = XLSX.SSF.parse_date_code(v);
      if (d) {
        return d.y + "-" + String(d.m).padStart(2, "0") + "-" + String(d.d).padStart(2, "0");
      }
    }
    return String(v).trim();
  }

  function validateImportRow(row) {
    const required = IMPORT_COLUMNS.filter((c) => c.required).map((c) => c.key);
    const missing = required.filter((k) => !row[k]);
    if (missing.length) {
      return (
        "กรอกไม่ครบ: " +
        missing.map((k) => IMPORT_COLUMNS.find((c) => c.key === k).label).join(", ")
      );
    }
    if (!/^[A-Za-z0-9\-_./]+$/.test(row.studentId)) return "รหัสนักเรียนมีอักขระไม่ถูกต้อง";
    if (row.studentId.length > 20) return "รหัสนักเรียนยาวเกินไป";
    if (!/^\d{13}$/.test(row.citizenId)) return "เลขบัตรประชาชนต้องเป็นตัวเลข 13 หลัก";
    return "";
  }

  function handleImportFileSelect(event) {
    const file = event.target.files && event.target.files[0];
    if (!file) return;
    const preview = document.getElementById("importPreview");
    preview.innerHTML =
      '<div class="text-center text-secondary py-4"><i class="bi bi-hourglass-split me-2"></i>กำลังอ่านไฟล์...</div>';
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const wb = XLSX.read(new Uint8Array(e.target.result), { type: "array" });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "" });
        renderImportPreview(rows);
      } catch (err) {
        preview.innerHTML =
          '<div class="alert alert-danger small">อ่านไฟล์ไม่สำเร็จ: ' + err.message + "</div>";
      }
    };
    reader.readAsArrayBuffer(file);
  }

  function renderImportPreview(rows) {
    const preview = document.getElementById("importPreview");
    if (!rows || rows.length < 2) {
      preview.innerHTML =
        '<div class="alert alert-warning small">ไม่พบข้อมูลในไฟล์ — ไฟล์ต้องมีแถวหัวคอลัมน์และข้อมูลอย่างน้อย 1 แถว</div>';
      return;
    }
    const headers = rows[0].map((h) => String(h || "").trim());
    const colMap = {};
    IMPORT_COLUMNS.forEach((c) => {
      const idx = headers.indexOf(c.label);
      if (idx !== -1) colMap[c.key] = idx;
    });

    const missingHeaders = IMPORT_COLUMNS.filter(
      (c) => c.required && colMap[c.key] === undefined,
    ).map((c) => c.label);
    if (missingHeaders.length) {
      preview.innerHTML =
        '<div class="alert alert-warning small">⚠️ ไม่พบคอลัมน์ที่จำเป็นในไฟล์: <b>' +
        missingHeaders.join(", ") +
        "</b> — กรุณาใช้ไฟล์ตามเทมเพลต</div>";
      document.getElementById("importSubmitBtn").disabled = true;
      return;
    }

    const parsed = [];
    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      if (!r || r.every((cell) => String(cell === undefined ? "" : cell).trim() === "")) continue;
      const row = {};
      IMPORT_COLUMNS.forEach((c) => {
        const idx = colMap[c.key];
        row[c.key] = idx === undefined ? "" : normalizeImportCell(r[idx]);
      });
      parsed.push({ line: i + 1, row: row, error: validateImportRow(row) });
    }

    if (!parsed.length) {
      preview.innerHTML = '<div class="alert alert-warning small">ไม่พบแถวข้อมูลในไฟล์</div>';
      return;
    }

    importValidRows = parsed.filter((p) => !p.error).map((p) => p.row);
    const ok = importValidRows.length;
    const bad = parsed.length - ok;

    preview.innerHTML =
      '<div class="d-flex gap-2 mb-2 flex-wrap">' +
      '<span class="badge-soft badge-navy">พบข้อมูล ' + parsed.length + " แถว</span>" +
      '<span class="badge-soft badge-good">ผ่าน ' + ok + " แถว</span>" +
      (bad ? '<span class="badge-soft badge-bad">ผิดพลาด ' + bad + " แถว</span>" : "") +
      '</div><div style="max-height:320px;overflow:auto">' +
      '<table class="custom-table"><thead><tr><th>บรรทัด</th><th>รหัสนักเรียน</th><th>ชื่อ-นามสกุล</th><th>ชั้น/ห้อง</th><th>สถานะ</th><th>รายละเอียด</th></tr></thead><tbody>' +
      parsed
        .map(
          (p) =>
            "<tr>" +
            "<td>" + p.line + "</td>" +
            "<td>" + (p.row.studentId || "-") + "</td>" +
            "<td>" + (p.row.prefix || "") + (p.row.firstName || "") + " " + (p.row.lastName || "") + "</td>" +
            "<td>" + (p.row.grade || "-") + "/" + (p.row.room || "-") + "</td>" +
            "<td>" +
            (p.error
              ? '<span class="badge-soft badge-bad">ผิดพลาด</span>'
              : '<span class="badge-soft badge-good">ผ่าน</span>') +
            "</td>" +
            "<td class=\"text-secondary\">" + (p.error || "พร้อมนำเข้า") + "</td>" +
            "</tr>",
        )
        .join("") +
      "</tbody></table></div>";

    const btn = document.getElementById("importSubmitBtn");
    btn.disabled = ok === 0;
    btn.innerHTML =
      ok > 0
        ? '<i class="bi bi-upload me-1"></i> นำเข้านักเรียน ' + ok + " คน"
        : '<i class="bi bi-upload me-1"></i> นำเข้านักเรียน';
  }

  function submitImportStudents() {
    if (!importValidRows.length) return;
    Swal.fire({
      icon: "question",
      title: "ยืนยันการนำเข้า",
      html: "นำเข้านักเรียน <b>" + importValidRows.length + " คน</b> เข้าสู่ระบบ?",
      showCancelButton: true,
      confirmButtonText: "ยืนยันนำเข้า",
      cancelButtonText: "ยกเลิก",
    }).then((r) => {
      if (!r.isConfirmed) return;
      google.script.run
        .withSuccessHandler((res) => {
          if (!res.success) {
            Swal.fire({ icon: "error", title: "นำเข้าไม่สำเร็จ", text: res.message });
            return;
          }
          const lines = ["นำเข้าเรียบร้อย <b>" + res.imported + " คน</b>"];
          if (res.failed > 0) {
            lines.push("ข้าม <b>" + res.failed + " รายการ</b> ที่มีข้อผิดพลาด (ดูจากพรีวิว)");
          }
          Swal.fire({
            icon: "success",
            title: "นำเข้านักเรียนเสร็จสิ้น",
            html: lines.join("<br>"),
            timer: 2500,
            showConfirmButton: false,
          });
          bootstrap.Modal.getInstance(document.getElementById("importStudentsModal")).hide();
          loadStudents();
        })
        .withFailureHandler((err) =>
          Swal.fire({ icon: "error", title: "เกิดข้อผิดพลาด", text: err.message }),
        )
        .apiImportStudents(getToken(), importValidRows);
    });
  }

  function saveStudent() {
    const studentCode = document
      .getElementById("sm_studentCode")
      .value.trim();
    const payload = {
      studentId: studentCode,
      prefix: document.getElementById("sm_prefix").value,
      firstName: document.getElementById("sm_firstName").value.trim(),
      lastName: document.getElementById("sm_lastName").value.trim(),
      gender: document.getElementById("sm_gender").value,
      grade: document.getElementById("sm_grade").value,
      room: document.getElementById("sm_room").value.trim(),
      no: document.getElementById("sm_no").value,
      citizenId: document.getElementById("sm_citizenId").value.trim(),
      dob: document.getElementById("sm_dob").value,
      bloodType: document.getElementById("sm_bloodType").value,
      weight: document.getElementById("sm_weight").value,
      height: document.getElementById("sm_height").value,
      nationality: document.getElementById("sm_nationality").value,
      religion: document.getElementById("sm_religion").value,
      ethnicity: document.getElementById("sm_ethnicity").value,
      addressNo: document.getElementById("sm_addressNo").value,
      addressMoo: document.getElementById("sm_addressMoo").value,
      addressRoad: document.getElementById("sm_addressRoad").value,
      addressTambon: document.getElementById("sm_addressTambon").value,
      addressAmphoe: document.getElementById("sm_addressAmphoe").value,
      addressProvince: document.getElementById("sm_addressProvince").value,
      parentName: document.getElementById("sm_parentName").value.trim(),
      parentRelation: document.getElementById("sm_parentRelation").value,
      parentJob: document.getElementById("sm_parentJob").value.trim(),
      parentPhone: document.getElementById("sm_parentPhone").value.trim(),
      fatherName: document.getElementById("sm_fatherName").value,
      fatherJob: document.getElementById("sm_fatherJob").value,
      motherName: document.getElementById("sm_motherName").value,
      motherJob: document.getElementById("sm_motherJob").value,
    };

    const requiredFields = [
      { key: "studentId", label: "รหัสนักเรียน" },
      { key: "prefix", label: "คำนำหน้า" },
      { key: "firstName", label: "ชื่อ" },
      { key: "lastName", label: "นามสกุล" },
      { key: "gender", label: "เพศ" },
      { key: "grade", label: "ระดับชั้น" },
      { key: "room", label: "ห้อง" },
      { key: "no", label: "เลขที่" },
      { key: "citizenId", label: "เลขประจำตัวประชาชน" },
      { key: "dob", label: "วันเดือนปีเกิด" },
      { key: "parentName", label: "ชื่อ-นามสกุลผู้ปกครอง" },
      { key: "parentPhone", label: "เบอร์โทรศัพท์ผู้ปกครอง" },
    ];
    const missing = requiredFields.filter(
      (f) => !payload[f.key] || String(payload[f.key]).trim() === "",
    );
    if (missing.length > 0) {
      Swal.fire({
        icon: "warning",
        title: "กรุณากรอกข้อมูลให้ครบ",
        html:
          "ยังไม่ได้กรอก: <b>" +
          missing.map((f) => f.label).join(", ") +
          "</b>",
      });
      return;
    }
    if (payload.citizenId.length !== 13 || !/^\d+$/.test(payload.citizenId)) {
      Swal.fire({
        icon: "warning",
        title: "เลขประจำตัวประชาชนไม่ถูกต้อง",
        text: "ต้องเป็นตัวเลข 13 หลัก",
      });
      return;
    }
    if (!/^[A-Za-z0-9\-_./]+$/.test(studentCode)) {
      Swal.fire({
        icon: "warning",
        title: "รหัสนักเรียนไม่ถูกต้อง",
        text: "ใช้ตัวอักษร ตัวเลข หรือ - _ . / เท่านั้น",
      });
      return;
    }

    const editId = document.getElementById("sm_studentId").value;
    // แก้ไข: รหัสนักเรียนไม่สามารถเปลี่ยนได้ ไม่อนุญาตให้ส่งรหัสใหม่ไปบันทึก
    if (editId) delete payload.studentId;

    if (editId) {
      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            uploadPendingPhoto(editId, () => {
              bootstrap.Modal.getInstance(
                document.getElementById("studentModal"),
              ).hide();
              Swal.fire({
                icon: "success",
                title: "บันทึกสำเร็จ",
                timer: 1500,
                showConfirmButton: false,
              });
              openProfile(editId);
            });
          } else {
            Swal.fire({
              icon: "error",
              title: "บันทึกไม่สำเร็จ",
              text: res.message,
            });
          }
        })
        .withFailureHandler((err) =>
          Swal.fire({
            icon: "error",
            title: "เกิดข้อผิดพลาด",
            text: err.message,
          }),
        )
        .apiUpdateStudent(getToken(), editId, payload);
    } else {
      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            uploadPendingPhoto(res.studentId, () => {
              bootstrap.Modal.getInstance(
                document.getElementById("studentModal"),
              ).hide();
              showSaveSuccess(
                "บันทึกนักเรียนเรียบร้อย",
                res.recordSequence,
                [{ text: "ข้อมูลนักเรียนถูกบันทึกลงระบบแล้ว" }],
              );
              loadStudents();
            });
          } else {
            Swal.fire({
              icon: "error",
              title: "บันทึกไม่สำเร็จ",
              text: res.message,
            });
          }
        })
        .withFailureHandler((err) =>
          Swal.fire({
            icon: "error",
            title: "เกิดข้อผิดพลาด",
            text: err.message,
          }),
        )
        .apiAddStudent(getToken(), payload);
    }
  }

  function renderProfile(res) {
    if (!res.success) {
      document.getElementById("profileContent").innerHTML =
        `<div class="alert alert-danger">${res.message}</div>`;
      return;
    }
    const st = res.student;
    const parent = res.parent || {};
    const timeline = res.timeline || [];

    // ---- สรุปคะแนนความประพฤติ (เริ่มต้น / หัก / คงเหลือ) ----
    const sc = res.scoreSummary || {};
    const initialScore = Number(sc.initialScore) || 100;
    const totalDeducted = Math.max(0, Number(sc.totalDeducted) || 0);
    const hasDeduction = Number(sc.deductedCount || 0) > 0;
    const currentScore = !isNaN(Number(sc.currentScore))
      ? Number(sc.currentScore)
      : Number(st.CurrentScore) || 0;

    // สถานะความประพฤติ: ไม่มีประวัติหักคะแนน หรือคะแนน >= 80 → ยอดเยี่ยม
    let conduct = { cls: "cb-excellent", title: "ยอดเยี่ยม", sub: "ความประพฤติดีมาก" };
    if (hasDeduction && currentScore < 80) {
      if (currentScore >= 60)
        conduct = { cls: "cb-good", title: "ดี", sub: "ความประพฤติอยู่ในเกณฑ์ดี" };
      else if (currentScore >= 40)
        conduct = { cls: "cb-fair", title: "พอใช้", sub: "ควรปรับปรุงความประพฤติ" };
      else
        conduct = { cls: "cb-watch", title: "ต้องปรับปรุง", sub: "อยู่ในเกณฑ์เฝ้าระวังเป็นพิเศษ" };

    const scoreSectionHtml = `

            </div>
            <div class="sc-val">${initialScore}</div>

          </div>
        </div>
      </div>

      <div class="conduct-banner ${conduct.cls} mb-3">
        <i class="bi bi-stars cb-icon"></i>
        <div>
          <div class="cb-title">${conduct.title}</div>
          <div class="cb-sub">${conduct.sub}</div>
        </div>

  function submitScore() {
    if (!selectedScoreStudent) {
      Swal.fire({ icon: "warning", title: "กรุณาเลือกนักเรียนก่อน" });
      return;
    }
    const amount = parseInt(document.getElementById("scoreAmount").value) || 0;
    const reason = document.getElementById("scoreReasonText").value.trim();
    if (amount <= 0) {
      Swal.fire({ icon: "warning", title: "กรุณาระบุจำนวนคะแนนให้ถูกต้อง" });
      return;
    }
    if (!reason) {
      Swal.fire({ icon: "warning", title: "กรุณาระบุเหตุผล" });
      return;
    }

    Swal.fire({
      icon: "question",
      title:
        scoreType === "add"
          ? `เพิ่มคะแนน ${amount} คะแนน?`
          : `ลดคะแนน ${amount} คะแนน?`,
      text: `${selectedScoreStudent.Prefix || ""}${selectedScoreStudent.FirstName} ${selectedScoreStudent.LastName} — เหตุผล: ${reason}`,
      showCancelButton: true,
      confirmButtonText: "ยืนยันบันทึก",
      cancelButtonText: "ยกเลิก",
      confirmButtonColor: scoreType === "add" ? "#1f8a5b" : "#c2483a",
    }).then((r) => {
      if (!r.isConfirmed) return;

      google.script.run
        .withSuccessHandler((res) => {
          if (!res.success) {
            Swal.fire({
              icon: "error",
              title: "บันทึกไม่สำเร็จ",
              text: res.message,
            });
            return;
          }
          const lines = [{ text: `คะแนนคงเหลือ: ${res.newScore} คะแนน` }];
          if (res.alertTriggered !== null && res.alertTriggered !== undefined) {
            lines.push({
              text: `⚠️ คะแนนลดถึงเกณฑ์ ${res.alertTriggered} คะแนน — ควรเชิญผู้ปกครอง`,
              color: "#c9861f",
            });
          }
          showSaveSuccess("บันทึกคะแนนเรียบร้อย", res.recordSequence, lines);

          document.getElementById("scoreReasonText").value = "";
          document.getElementById("scoreReasonPreset").value = "";
          clearScoreStudent();
          loadScoreHistory();
        })
        .withFailureHandler((err) =>
          Swal.fire({
            icon: "error",
            title: "เกิดข้อผิดพลาด",
            text: err.message,
          }),
        )
        .apiAddScore(getToken(), {
          studentId: selectedScoreStudent.StudentID,
          type: scoreType,
          amount: amount,
          reason: reason,
        });
    });
  }

  function loadLeaveRequests() {
    document.getElementById("leaveTableBody").innerHTML =
      '<tr><td colspan="5" class="text-center text-secondary py-4">กำลังโหลด...</td></tr>';

    google.script.run
      .withSuccessHandler((res) => {
        if (!res.success) {
          document.getElementById("leaveTableBody").innerHTML =
            '<tr><td colspan="5" class="text-center text-secondary py-4">โหลดข้อมูลไม่สำเร็จ</td></tr>';
          return;
        }
        document.getElementById("leavePendingBadge").textContent =
          res.pendingCount;
        document.getElementById("leaveApprovedBadge").textContent =
          res.approvedCount;
        document.getElementById("leaveRejectedBadge").textContent =
          res.rejectedCount;
        document.getElementById("leaveAllBadge").textContent = res.totalCount;

        const canApprove =
          currentUser &&
          currentUser.permissions &&
          currentUser.permissions.approveLeave;

        const rows = res.requests
          .map((r) => {
            const statusBadge =
              r.Status === "pending"
                ? '<span class="badge-soft badge-warn">รอดำเนินการ</span>'
                : r.Status === "approved"
                  ? '<span class="badge-soft badge-good">อนุมัติแล้ว</span>'
                  : '<span class="badge-soft badge-bad">ไม่อนุมัติ</span>';

            const actionBtns =
              r.Status === "pending" && canApprove
                ? `
            <button class="btn btn-sm btn-outline-success me-1" onclick="handleLeaveAction('${r.RequestID}','approved')"><i class="bi bi-check-lg"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="handleLeaveAction('${r.RequestID}','rejected')"><i class="bi bi-x-lg"></i></button>`
                : r.Status === "approved"
                  ? `<button class="btn btn-sm btn-outline-navy" onclick="openRecordActualOut('${r.RequestID}','${r.StudentName}')"><i class="bi bi-door-open me-1"></i> เวลาออกจริง</button>`
                  : '<span class="text-secondary small">—</span>';

            const timeCell =
              `${r.RequestedDate ? `วันที่ ${formatDateOnlyThai(r.RequestedDate)} · ` : ""}ออก ${formatTimeDisplay(r.RequestedOutTime)} น. · กลับ ${formatTimeDisplay(r.RequestedInTime)} น.` +
              (r.ActualOutTime
                ? `<div class="text-secondary" style="font-size:.72rem">ออกจริง ${formatTimeDisplay(r.ActualOutTime)} น.${r.ActualInTime ? " · กลับถึง " + formatTimeDisplay(r.ActualInTime) + " น." : ""}</div>`
                : "");

            return `
          <tr>
            <td>${r.StudentName}<div class="text-secondary" style="font-size:.72rem">${r.StudentClass}</div></td>
            <td class="text-secondary small">${r.Reason}</td>
            <td class="small">${timeCell}</td>
            <td>${statusBadge}</td>
            <td class="text-end">${actionBtns}</td>
          </tr>`;
          })
          .join("");

        document.getElementById("leaveTableBody").innerHTML =
          rows ||
          '<tr><td colspan="5" class="text-center text-secondary py-4">ไม่มีรายการ</td></tr>';
      })
      .withFailureHandler(() => {
        document.getElementById("leaveTableBody").innerHTML =
          '<tr><td colspan="5" class="text-center text-secondary py-4">โหลดข้อมูลไม่สำเร็จ</td></tr>';
      })

      return;

      .withSuccessHandler((res) => {

  function submitLetterDraft() {
    if (!selectedLetterStudent) {
      Swal.fire({ icon: "warning", title: "กรุณาเลือกนักเรียนก่อน" });
      return;
    }
    const detail = document.getElementById("lt_detail").value.trim();
    const letterNoSuffix = document
      .getElementById("lt_letterNoSuffix")
      .value.trim();
    const appointmentDate = document.getElementById("lt_appointmentDate").value;
    const appointmentTime = document.getElementById("lt_appointmentTime").value;

    if (!detail) {
      Swal.fire({ icon: "warning", title: "กรุณาระบุรายละเอียดปัญหา" });
      return;
    }
    if (!/^ว\d+$/.test(letterNoSuffix)) {
      Swal.fire({ icon: "warning", title: "กรุณากรอกเลขลำดับในรูปแบบ ว116" });
      return;
    }
    if (!appointmentDate || !appointmentTime) {
      Swal.fire({ icon: "warning", title: "กรุณาระบุวันและเวลานัดหมาย" });
      return;
    }

    google.script.run
      .withSuccessHandler((res) => {
        if (res.success) {
          bootstrap.Modal.getInstance(
            document.getElementById("letterModal"),
          ).hide();

          Swal.fire({
            icon: "error",
            title: "สร้างไม่สำเร็จ",
            text: res.message,
          });

      })
      .withFailureHandler((err) =>
        Swal.fire({
          icon: "error",
          title: "เกิดข้อผิดพลาด",
          text: err.message,
        }),

      .apiCreateLetter(getToken(), {
        studentId: selectedLetterStudent.StudentID,
        letterNoSuffix: letterNoSuffix,
        detail: detail,
        appointmentDate: appointmentDate,
        appointmentTime: appointmentTime,
        signatureType: document.getElementById("lt_signatureType").value,
      });

  function switchLetterTab(status) {
    currentLetterTab = status;

      .forEach((t) =>
        t.classList.toggle("active", t.dataset.status === status),

  function loadLetters() {
    document.getElementById("letterTableBody").innerHTML =
      '<tr><td colspan="6" class="text-center text-secondary py-4">กำลังโหลด...</td></tr>';

    google.script.run
      .withSuccessHandler((res) => {
        if (!res.success) {
          document.getElementById("letterTableBody").innerHTML =
            '<tr><td colspan="6" class="text-center text-secondary py-4">โหลดข้อมูลไม่สำเร็จ</td></tr>';
          return;
        }
        document.getElementById("letterDraftBadge").textContent =
          res.draftCount;
        document.getElementById("letterConfirmedBadge").textContent =
          res.confirmedCount;
        document.getElementById("letterAllBadge").textContent = res.totalCount;

        const canManage =
          currentUser &&
          currentUser.permissions &&
          currentUser.permissions.editDelete;

        const rows = res.letters
          .map((l) => {
            const statusBadge =
              l.Status === "draft"
                ? '<span class="badge-soft badge-warn">ร่าง (รอยืนยัน)</span>'
                : '<span class="badge-soft badge-good">ออกเอกสารแล้ว</span>';
            let actionBtn = '<span class="text-secondary small">—</span>';
            if (l.Status === "draft" && canManage) {
              actionBtn = `<button class="btn btn-sm btn-navy" onclick="confirmLetter('${l.LetterID}', '${encodeURIComponent(l.LetterNo || "")}')"><i class="bi bi-check-lg me-1"></i>ยืนยันออกเอกสาร</button>`;
            } else if (l.Status === "confirmed" && l.PdfFileID) {
              actionBtn = `<a class="btn btn-sm btn-outline-secondary" href="${getDriveFileUrl_(l.PdfFileID)}" target="_blank"><i class="bi bi-file-earmark-pdf me-1"></i>เปิด PDF</a>`;
            }
            return `
          <tr>
            <td>${l.LetterNo}</td>
            <td>${l.StudentName}</td>
            <td class="text-secondary small">${l.Subject}</td>
            <td><span class="badge-soft badge-navy">${l.SignatureType}</span></td>
            <td>${statusBadge}</td>
            <td class="text-end">${actionBtn}</td>
          </tr>`;
          })
          .join("");

        document.getElementById("letterTableBody").innerHTML =
          rows ||
          '<tr><td colspan="6" class="text-center text-secondary py-4">ไม่มีรายการ</td></tr>';
      })
      .withFailureHandler(() => {
        document.getElementById("letterTableBody").innerHTML =
          '<tr><td colspan="6" class="text-center text-secondary py-4">โหลดข้อมูลไม่สำเร็จ</td></tr>';
      })
      .apiGetLetters(getToken(), { status: currentLetterTab });
  }

  function requestAppointmentBeforeConfirmation(letterId, encodedLetterNo) {
    Swal.fire({
      title: "ระบุวันและเวลานัดหมาย",
      html: `
        <div class="text-start small text-secondary mb-3">วันนัดหมายสามารถต่างจากวันออกเอกสารได้</div>
        <label class="form-label w-100 text-start">วันที่นัดหมาย</label>
        <input id="confirmAppointmentDate" type="date" class="swal2-input m-0 mb-3" style="width:100%">
        <label class="form-label w-100 text-start">เวลานัดหมาย</label>
        <input id="confirmAppointmentTime" type="time" class="swal2-input m-0" style="width:100%">
      `,
      showCancelButton: true,
      confirmButtonText: "ยืนยันออกเอกสาร",
      cancelButtonText: "ยกเลิก",
      preConfirm: () => {
        const appointmentDate = document.getElementById(
          "confirmAppointmentDate",
        ).value;
        const appointmentTime = document.getElementById(
          "confirmAppointmentTime",
        ).value;
        if (!appointmentDate || !appointmentTime) {
          Swal.showValidationMessage("กรุณาระบุวันและเวลานัดหมาย");
          return false;
        }
        return { appointmentDate, appointmentTime };
      },
    }).then((result) => {
      if (result.isConfirmed) {
        confirmLetter(
          letterId,
          encodedLetterNo,
          result.value.appointmentDate,
          result.value.appointmentTime,
        );
      }
    });
  }

  function confirmLetter(
    letterId,
    encodedLetterNo,
    appointmentDate,
    appointmentTime,
  ) {
    const existingLetterNo = decodeURIComponent(encodedLetterNo || "");
    if (!existingLetterNo) {
      Swal.fire({
        title: "กรอกเลขลำดับหนังสือ",
        input: "text",
        inputPlaceholder: "ว116",
        inputLabel: "ระบบจะใช้เลขที่ ศธ 04293.43/ ตามด้วยค่าที่กรอก",
        showCancelButton: true,
        confirmButtonText: "ถัดไป",
        cancelButtonText: "ยกเลิก",
        inputValidator: (value) =>
          /^ว\d+$/.test((value || "").trim())
            ? undefined
            : "กรุณากรอกในรูปแบบ ว116",
      }).then((result) => {
        if (result.isConfirmed)
          confirmLetter(
            letterId,
            encodeURIComponent((result.value || "").trim()),
          );
      });
      return;
    }
    Swal.fire({
      icon: "question",
      title: "ยืนยันออกเอกสาร?",
      text: "ระบบจะสร้างไฟล์ PDF และบันทึกลง Google Drive",
      showCancelButton: true,
      confirmButtonText: "ยืนยันออกเอกสาร",
      cancelButtonText: "ยกเลิก",
      confirmButtonColor: "#152A52",
    }).then((r) => {
      if (!r.isConfirmed) return;

      Swal.fire({
        title: "กำลังสร้างเอกสาร...",
        allowOutsideClick: false,
        didOpen: () => Swal.showLoading(),
      });

      google.script.run
        .withSuccessHandler((res) => {
          if (res.success) {
            Swal.fire({
              icon: "success",
              title: "ออกเอกสารเรียบร้อยแล้ว",
              html: `<a href="${res.pdfUrl}" target="_blank" class="btn btn-sm btn-navy mt-2">เปิดไฟล์ PDF</a>`,
            });
            loadLetters();
          } else if (
            res.message === "กรุณาระบุวันและเวลานัดหมายก่อนยืนยันออกเอกสาร"
          ) {
            requestAppointmentBeforeConfirmation(letterId, encodedLetterNo);
          } else {
            Swal.fire({
              icon: "error",
              title: "ดำเนินการไม่สำเร็จ",
              text: res.message,
            });
          }
        })
        .withFailureHandler((err) =>
          Swal.fire({
            icon: "error",
            title: "เกิดข้อผิดพลาด",
            text: err.message,
          }),
        )
        .apiConfirmLetter(
          getToken(),
          letterId,
          appointmentDate || "",
          appointmentTime || "",
          existingLetterNo.startsWith("ศธ 04293.43/")
            ? existingLetterNo.slice("ศธ 04293.43/".length)
            : existingLetterNo,
        );
    });
  }

  function applyLineSettingsLock() {
    ["ls_token", "ls_liffId", "ls_contact", "ls_notifyAdd"].forEach((id) => {
      const el = document.getElementById(id);
      if (el) el.disabled = lineSettingsLocked;
    });
    const btnSave = document.getElementById("ls_btnSave");
    const btnTest = document.getElementById("ls_btnTest");
    if (btnSave) {
      btnSave.disabled = lineSettingsLocked;
      btnSave.innerHTML = lineSettingsLocked
        ? '<i class="bi bi-lock me-1"></i> ตั้งค่าถูกล็อก'
        : '<i class="bi bi-save2 me-1"></i> บันทึกการตั้งค่า';
    }
    if (btnTest) btnTest.disabled = lineSettingsLocked;
    const lockBar = document.getElementById("ls_lockBar");
    if (lockBar) lockBar.style.display = lineSettingsLocked ? "" : "none";
  }

  function unlockLineSettings() {
    Swal.fire({
      title: "ยืนยันตัวตนเพื่อแก้ไขการตั้งค่า",
      html:
        '<input id="swal_user" class="swal2-input" placeholder="ชื่อผู้ใช้ (Username)" autocomplete="off">' +
        '<input id="swal_pass" class="swal2-input" type="password" placeholder="รหัสผ่าน (Password)">',
      showCancelButton: true,
      confirmButtonText: "ยืนยัน",
      cancelButtonText: "ยกเลิก",
      preConfirm: () => {
        const u = document.getElementById("swal_user").value.trim();
        const p = document.getElementById("swal_pass").value;
        if (!u || !p) {
          Swal.showValidationMessage("กรุณากรอกชื่อผู้ใช้และรหัสผ่าน");
          return false;
        }
        return new Promise((resolve) => {
          google.script.run
            .withSuccessHandler((res) => {
              if (!res.success) {
                Swal.showValidationMessage(res.message);
                resolve(false);
                return;
              }
              lineSettingsLocked = false;
              applyLineSettingsLock();
              resolve(true);
            })
            .withFailureHandler((err) => {
              Swal.showValidationMessage(err.message);
              resolve(false);
            })
            .verifyAdminPassword(getToken(), u, p);
        });
      },
    }).then((result) => {
      if (result.isConfirmed) {
        Swal.fire({
          icon: "success",
          title: "ปลดล็อกแล้ว",
          text: "สามารถแก้ไขการตั้งค่าได้",
          timer: 1300,
          showConfirmButton: false,
        });
      }
    });
  }

  function saveLineSettings() {
    const payload = {
      channelAccessToken: document.getElementById("ls_token").value,
      liffId: document.getElementById("ls_liffId").value,
      contactChannel: document.getElementById("ls_contact").value,
      notifyScoreAdd: document.getElementById("ls_notifyAdd").checked,
    };
    google.script.run
      .withSuccessHandler((res) => {
        if (res.success) {
          Swal.fire({
            icon: "success",
            title: "บันทึกการตั้งค่า LINE แล้ว",
            text: "การตั้งค่าถูกล็อกแล้ว — แก้ไขต้องยืนยันชื่อผู้ใช้และรหัสผ่าน",
            timer: 1500,
            showConfirmButton: false,
          });
          lineSettingsLocked = true;
          loadLineSettings();

          Swal.fire({ icon: "error", title: "บันทึกไม่สำเร็จ", text: res.message });

        Swal.fire({ icon: "error", title: "เกิดข้อผิดพลาด", text: err.message }),

  function loadAnnouncements() {
    const el = document.getElementById("lineAnnouncements");
    if (!el) return;
    google.script.run
      .withSuccessHandler((res) => {
        if (!res.success) {
          el.innerHTML = "";
          return;
        }
        renderAnnouncements(res.announcements || []);
      })
      .withFailureHandler(() => {
        el.innerHTML = "";
      })
      .apiGetAnnouncements(getToken());

    el.innerHTML = `

  function addAnnouncement() {
    const title = document.getElementById("an_title").value.trim();
    const message = document.getElementById("an_message").value.trim();
    const type = document.getElementById("an_type").value;
    const sendLine = document.getElementById("an_sendLine").checked;
    if (!title || !message) {
      Swal.fire({ icon: "warning", title: "กรุณากรอกหัวข้อและรายละเอียดข่าว" });
      return;
    }
    if (sendLine) {
      Swal.fire({
        icon: "question",
        title: "ส่ง LINE ให้ผู้ปกครองทุกคน?",
        text: "จะส่งประกาศนี้ผ่าน LINE ไปยังผู้ปกครองทุกคนที่เชื่อมบัญชีแล้ว (ใช้โควต้าข้อความแจ้งเตือน)",
        showCancelButton: true,
        confirmButtonText: "ยืนยันส่ง",
        cancelButtonText: "แค่บันทึก",
        confirmButtonColor: "#c9861f",
      }).then((r) => {
        if (r.dismiss === Swal.DismissReason.cancel) submitAnnouncement(title, message, type, false);
        else if (r.isConfirmed) submitAnnouncement(title, message, type, true);
      });
    } else {
      submitAnnouncement(title, message, type, false);
    }
  }

  function submitAnnouncement(title, message, type, sendLine) {
    google.script.run
      .withSuccessHandler((res) => {
        if (res.success) {
          const parts = ["บันทึกประกาศแล้ว"];
          if (res.broadcast) {
            parts.push(
              "ส่ง LINE เรียบร้อย " + res.broadcast.sent + "/" + res.broadcast.total + " ผู้ปกครอง",
            );
          }
          Swal.fire({
            icon: "success",
            title: "บันทึกข่าว/ประกาศแล้ว",
            html: parts.join("<br>"),
            timer: 2200,
            showConfirmButton: false,
          });
          loadLineSettings();
        } else {
          Swal.fire({ icon: "error", title: "บันทึกไม่สำเร็จ", text: res.message });
        }
      })
      .withFailureHandler((err) =>
        Swal.fire({ icon: "error", title: "เกิดข้อผิดพลาด", text: err.message }),
      )
      .apiAddAnnouncement(getToken(), title, message, type, sendLine);
  }

  function deleteAnnouncement(announcementId) {
    Swal.fire({
      icon: "question",
      title: "ลบประกาศนี้?",
      showCancelButton: true,
      confirmButtonText: "ลบ",

      google.script.run
        .withSuccessHandler((res) => {

            Swal.fire({
              icon: "success",
              title: "ลบแล้ว",
              timer: 1200,
              showConfirmButton: false,
            });

          } else {
            Swal.fire({ icon: "error", title: "ลบไม่สำเร็จ", text: res.message });
          }
        })
        .withFailureHandler((err) =>
          Swal.fire({ icon: "error", title: "เกิดข้อผิดพลาด", text: err.message }),
        )
        .apiDeleteAnnouncement(getToken(), announcementId);
    });
  }

  function loadUsers() {
    document.getElementById("userTableBody").innerHTML =
      '<tr><td colspan="6" class="text-center text-secondary py-4">กำลังโหลด...</td></tr>';

    google.script.run
      .withSuccessHandler((res) => {
        if (!res.success) {
          document.getElementById("userTableBody").innerHTML =
            `<tr><td colspan="6" class="text-center text-secondary py-4">${res.message}</td></tr>`;
          return;
        }
        const rows = res.users
          .map((u) => {
            const isSelf = currentUser && u.UserID === currentUser.userId;
            const statusBadge = u.Active
              ? '<span class="badge-soft badge-good">ใช้งานอยู่</span>'
              : '<span class="badge-soft badge-bad">ระงับการใช้งาน</span>';
            const lastLogin = u.LastLogin
              ? toThaiDate(u.LastLogin, true)
              : "ยังไม่เคยเข้าใช้งาน";
            const toggleBtn = isSelf
              ? '<span class="text-secondary small">บัญชีของฉัน</span>'
              : u.Active
                ? `<button class="btn btn-sm btn-outline-danger" onclick="toggleUser('${u.UserID}', false, '${u.FullName}')"><i class="bi bi-slash-circle me-1"></i>ระงับ</button>`
                : `<button class="btn btn-sm btn-outline-success" onclick="toggleUser('${u.UserID}', true, '${u.FullName}')"><i class="bi bi-check-circle me-1"></i>เปิดใช้งาน</button>`;
            return `
          <tr>
            <td>${u.Username}</td>
            <td>${u.FullName}</td>
            <td><span class="badge-soft badge-navy">${CONFIG_ROLE_LABELS_CLIENT[u.Role] || u.Role}</span></td>
            <td>${statusBadge}</td>
            <td class="text-secondary small">${lastLogin}</td>
            <td class="text-end">${toggleBtn}</td>
          </tr>`;
          })
          .join("");
        document.getElementById("userTableBody").innerHTML =
          rows ||
          '<tr><td colspan="6" class="text-center text-secondary py-4">ไม่มีข้อมูลผู้ใช้งาน</td></tr>';
      })
      .withFailureHandler((err) => {
        document.getElementById("userTableBody").innerHTML =
          `<tr><td colspan="6" class="text-center text-secondary py-4">เกิดข้อผิดพลาด: ${err.message}</td></tr>`;
      })
      .apiGetUsers(getToken());
  }

  function submitChangePassword() {
    const oldPassword = document.getElementById("cp_oldPassword").value;

  /**
   * บีบอัดรูปด้วย canvas ให้เหลือไม่เกิน 1MB โดยลดคุณภาพ/ขนาดลงเรื่อยๆ
   */
  function compressImageToUnder1MB(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = function (evt) {
        const img = new Image();
        img.onload = function () {
          let width = img.width;
          let height = img.height;
          const maxDim = 1600;
          if (width > maxDim || height > maxDim) {
            const ratio = Math.min(maxDim / width, maxDim / height);
            width = Math.round(width * ratio);
            height = Math.round(height * ratio);
          }

          const canvas = document.createElement("canvas");
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, width, height);

          const targetBytes = 1 * 1024 * 1024;
          let quality = 0.9;
          const mimeType =
            file.type === "image/png" ? "image/png" : "image/jpeg";

          function tryCompress() {
            const dataUrl = canvas.toDataURL(
              mimeType === "image/png" ? "image/png" : "image/jpeg",
              quality,
            );
            const base64 = dataUrl.split(",")[1];
            const sizeBytes = Math.ceil((base64.length * 3) / 4);

            if (sizeBytes <= targetBytes || quality <= 0.3) {
              resolve({
                base64: base64,
                mimeType:
                  mimeType === "image/png" && sizeBytes <= targetBytes
                    ? "image/png"
                    : "image/jpeg",
                sizeBytes: sizeBytes,
              });
            } else {
              quality -= 0.1;
              tryCompress();
            }
          }
          tryCompress();
        };
        img.onerror = () => reject(new Error("ไม่สามารถอ่านไฟล์รูปภาพได้"));
        img.src = evt.target.result;
      };
      reader.onerror = () => reject(new Error("ไม่สามารถอ่านไฟล์ได้"));
      reader.readAsDataURL(file);
    });
  }

   * Apps Script อาจส่ง null ได้เมื่อการเรียกฝั่ง Server สิ้นสุดโดยไม่มีข้อมูล

  function getValidReportResponse_(res, reportName) {
    if (!res || typeof res !== "object") {
      Swal.fire({
        icon: "error",
        title: "โหลดรายงานไม่สำเร็จ",
        text: reportName + " ไม่ได้รับข้อมูลจากระบบ กรุณาลองใหม่อีกครั้ง",
      });
      return null;

        icon: "error",
        title: "เกิดข้อผิดพลาด",
        text: res.message || "ไม่สามารถโหลด" + reportName + "ได้",
      });
      return null;
    }

    return res;
  }

    function loadLetterLeaveStats() {
      const filters = buildReportFilters_();
      if (!filters) return;

      ["dl_letterTotal", "dl_letterConfirmed", "dl_leaveTotal", "dl_leaveApproved"].forEach((id) => {
        document.getElementById(id).textContent = "–";
      });

      google.script.run
        .withSuccessHandler(renderLetterLeaveStats)
        .withFailureHandler((err) =>
          Swal.fire({
            icon: "error",
            title: "โหลดรายงานไม่สำเร็จ",
            text: err && err.message ? err.message : "ไม่สามารถติดต่อระบบได้",
          }),
        )
        .apiGetLetterLeaveStats(getToken(), filters);
    }

    function renderLetterLeaveStats(res) {
      res = getValidReportResponse_(res, "รายงานหนังสือเชิญและการออกนอกโรงเรียน");
      if (!res) return;

      const letterSummary = res.letterSummary || {};
      const leaveSummary = res.leaveSummary || {};
      const letterTrend = res.letterTrend || {};
      const leaveTrend = res.leaveTrend || {};
      const letterLabels = Array.isArray(letterTrend.labels) ? letterTrend.labels : [];
      const leaveLabels = Array.isArray(leaveTrend.labels) ? leaveTrend.labels : [];

      document.getElementById("dl_letterTotal").textContent = Number(letterSummary.total || 0).toLocaleString("th-TH");
      document.getElementById("dl_letterConfirmed").textContent = Number(letterSummary.confirmed || 0).toLocaleString("th-TH");
      document.getElementById("dl_leaveTotal").textContent = Number(leaveSummary.total || 0).toLocaleString("th-TH");
      document.getElementById("dl_leaveApproved").textContent = Number(leaveSummary.approved || 0).toLocaleString("th-TH");

      renderDocumentTrendChart_(
        "dl_letterChartEmpty",
        "dl_letterTrendChart",
        letterLabels,
        [
          { label: "ร่าง", data: Array.isArray(letterTrend.draftData) ? letterTrend.draftData : [], color: "#c9861f" },
          { label: "ออกเอกสารแล้ว", data: Array.isArray(letterTrend.confirmedData) ? letterTrend.confirmedData : [], color: "#1f8a5b" },
        ],
        "letter",
      );

      renderDocumentTrendChart_(
        "dl_leaveChartEmpty",
        "dl_leaveTrendChart",
        leaveLabels,
        [
          { label: "รอพิจารณา", data: Array.isArray(leaveTrend.pendingData) ? leaveTrend.pendingData : [], color: "#c9861f" },
          { label: "อนุมัติ", data: Array.isArray(leaveTrend.approvedData) ? leaveTrend.approvedData : [], color: "#1f8a5b" },
          { label: "ไม่อนุมัติ", data: Array.isArray(leaveTrend.rejectedData) ? leaveTrend.rejectedData : [], color: "#c2483a" },
        ],
        "leave",
      );
    }

    function renderDocumentTrendChart_(emptyId, canvasId, labels, datasets, chartType) {
      const empty = document.getElementById(emptyId);
      const canvas = document.getElementById(canvasId);
      if (!labels.length) {
        empty.style.display = "";
        canvas.style.display = "none";
        return;
      }

      empty.style.display = "none";
      canvas.style.display = "";
      if (chartType === "letter" && dlLetterTrendChartInstance) dlLetterTrendChartInstance.destroy();
      if (chartType === "leave" && dlLeaveTrendChartInstance) dlLeaveTrendChartInstance.destroy();

      const chart = new Chart(canvas, {
        type: "bar",
        data: {
          labels: labels.map((label) => toThaiDate(label)),
          datasets: datasets.map((dataset) => ({
            label: dataset.label,
            data: dataset.data,
            backgroundColor: dataset.color,
            borderRadius: 5,
            maxBarThickness: 28,
          })),
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: "bottom", labels: { font: { family: "Sarabun" }, boxWidth: 12 } },
          },
          scales: {
            x: { stacked: true, ticks: { font: { family: "Sarabun", size: 11 } }, grid: { display: false } },
            y: { stacked: true, beginAtZero: true, ticks: { font: { family: "Sarabun" }, precision: 0 } },
          },
        },
      });

      if (chartType === "letter") dlLetterTrendChartInstance = chart;
      if (chartType === "leave") dlLeaveTrendChartInstance = chart;
    }

</script>
