<script>
  let currentUser = null;

  /* ================= THAI DATE UTILITY (พ.ศ. จริง) ================= */
  function toThaiDate(dateInput, withTime) {
    const d = new Date(dateInput);
    if (isNaN(d.getTime())) return '-';
    let text = d.toLocaleDateString('th-TH-u-ca-buddhist', { year: 'numeric', month: 'long', day: 'numeric' });
    if (withTime) {
      const time = d.toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' });
      text += ' เวลา ' + time + ' น.';
    }
    return text;
  }
  function formatTimeDisplay(t) {
    if (!t) return '-';
    if (/^\d{1,2}:\d{2}$/.test(t)) return t;
    const d = new Date(t);
    if (!isNaN(d.getTime())) {
      const h = String(d.getUTCHours()).padStart(2, '0');
      const m = String(d.getUTCMinutes()).padStart(2, '0');
      return h + ':' + m;
    }
    return t;
  }

  /* ================= SESSION RESTORE ================= */
  document.addEventListener('DOMContentLoaded', function () {
    const savedUser = sessionStorage.getItem('sa_user');
    const savedToken = sessionStorage.getItem('sa_token');

    if (savedUser && savedToken) {
      google.script.run
        .withSuccessHandler(function (session) {
          if (session) {
            currentUser = JSON.parse(savedUser);
            showAppShell_();
          } else {
            sessionStorage.removeItem('sa_token');
            sessionStorage.removeItem('sa_user');
          }
        })
        .withFailureHandler(function () {
          sessionStorage.removeItem('sa_token');
          sessionStorage.removeItem('sa_user');
        })
        .validateSessionFromClient(savedToken);
    }

    document.querySelectorAll('.nav-link-custom').forEach(function (link) {
      link.addEventListener('click', function () { switchView(link.dataset.view); });
    });
  });

  /* ================= LOGIN ================= */
  function doLogin() {
    var username = document.getElementById('username').value.trim();
    var password = document.getElementById('password').value;
    var errBox = document.getElementById('loginError');
    errBox.classList.add('d-none');

    if (!username || !password) {
      errBox.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';
      errBox.classList.remove('d-none');
      return;
    }

    document.getElementById('loginBtn').disabled = true;
    document.getElementById('loginBtn').textContent = 'กำลังเข้าสู่ระบบ...';

    google.script.run
      .withSuccessHandler(onLoginSuccess)
      .withFailureHandler(onLoginFail)
      .handleLoginFromClient(username, password);
  }

  function onLoginSuccess(result) {
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = 'เข้าสู่ระบบ';

    if (!result.success) {
      var errBox = document.getElementById('loginError');
      errBox.textContent = result.message || 'เข้าสู่ระบบไม่สำเร็จ';
      errBox.classList.remove('d-none');
      return;
    }

    currentUser = result.user;
    sessionStorage.setItem('sa_token', result.token);
    sessionStorage.setItem('sa_user', JSON.stringify(result.user));

    showAppShell_();

    Swal.fire({
      icon: 'success',
      title: 'เข้าสู่ระบบสำเร็จ',
      text: 'ยินดีต้อนรับ ' + currentUser.fullName,
      timer: 1600,
      showConfirmButton: false
    });
  }

  function onLoginFail(error) {
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = 'เข้าสู่ระบบ';
    var errBox = document.getElementById('loginError');
    errBox.textContent = 'เกิดข้อผิดพลาด: ' + error.message;
    errBox.classList.remove('d-none');
  }

  /* ================= APP SHELL ================= */
  function showAppShell_() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'block';

    document.getElementById('sbName').textContent = currentUser.fullName;
    document.getElementById('sbRole').textContent = currentUser.roleLabel;
    document.getElementById('sbAvatar').textContent = currentUser.fullName.slice(0, 2);

    applyPermissions_();
    loadDashboard();
  }

  function applyPermissions_() {
    document.querySelectorAll('.nav-link-custom[data-perm]').forEach(function (link) {
      var perm = link.dataset.perm;
      if (perm && currentUser.permissions && !currentUser.permissions[perm]) {
        link.style.display = 'none';
      } else {
        link.style.display = '';
      }
    });
  }

  /* ================= LOGOUT ================= */
  function doLogout() {
    Swal.fire({
      icon: 'question',
      title: 'ออกจากระบบ?',
      showCancelButton: true,
      confirmButtonText: 'ออกจากระบบ',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: '#c2483a'
    }).then(function (r) {
      if (r.isConfirmed) {
        sessionStorage.removeItem('sa_token');
        sessionStorage.removeItem('sa_user');
        currentUser = null;
        document.getElementById('appShell').style.display = 'none';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
        document.querySelectorAll('.nav-link-custom[data-perm]').forEach(function (link) {
          link.style.display = '';
        });
      }
    });
  }

  /* ================= NAV ================= */
  function switchView(name) {
    document.querySelectorAll('.view').forEach(function (v) { v.classList.remove('active'); });
    document.getElementById('view-' + name).classList.add('active');
    document.querySelectorAll('.nav-link-custom').forEach(function (l) {
      l.classList.toggle('active', l.dataset.view === name);
    });
    document.getElementById('sidebar').classList.remove('open');

    if (name === 'students') loadStudents();
    if (name === 'dashboard') loadDashboard();
    if (name === 'score') loadScoreHistory();
    if (name === 'leave') loadLeaveRequests();
    if (name === 'letters') loadLetters();
    if (name === 'users') loadUsers();
  }

  /* ================= STUDENTS MODULE ================= */
  let studentSearchTimer = null;
  let currentStudentId = null;

  function getToken() { return sessionStorage.getItem('sa_token'); }

  function debounceSearchStudents() {
    clearTimeout(studentSearchTimer);
    studentSearchTimer = setTimeout(loadStudents, 400);
  }

  function loadStudents() {
    const filters = {
      q: document.getElementById('studentSearch').value,
      grade: document.getElementById('filterGrade').value,
      room: document.getElementById('filterRoom').value
    };
    document.getElementById('studentTableBody').innerHTML = '<tr><td colspan="7" class="text-center text-secondary py-4">กำลังโหลด...</td></tr>';

    google.script.run
      .withSuccessHandler(renderStudentTable)
      .withFailureHandler(err => Swal.fire({ icon: 'error', title: 'โหลดข้อมูลไม่สำเร็จ', text: err.message }))
      .apiGetStudents(getToken(), filters);
  }

  function renderStudentTable(res) {
    if (!res.success) {
      Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: res.message });
      document.getElementById('studentTableBody').innerHTML = '<tr><td colspan="7" class="text-center text-secondary py-4">โหลดข้อมูลไม่สำเร็จ</td></tr>';
      return;
    }
    document.getElementById('studentCount').textContent = res.total + ' รายการ';
    const canManage = currentUser && currentUser.permissions && currentUser.permissions.editDelete;

    const rows = res.students.map(st => {
      const fullName = (st.Prefix || '') + (st.FirstName || '') + ' ' + (st.LastName || '');
      const actionBtns = `
        <button class="btn btn-outline-secondary" title="ดูรายละเอียด" onclick="event.stopPropagation(); openProfile('${st.StudentID}')"><i class="bi bi-eye"></i></button>
        ${canManage ? `
        <button class="btn btn-outline-primary" title="แก้ไขข้อมูล" onclick="event.stopPropagation(); openEditStudentModal('${st.StudentID}')"><i class="bi bi-pencil"></i></button>
        <button class="btn btn-outline-danger" title="ลบนักเรียน" onclick="event.stopPropagation(); deleteStudent('${st.StudentID}')"><i class="bi bi-trash"></i></button>` : ''}
      `;
      return `
      <tr class="student-row" onclick="openProfile('${st.StudentID}')">
        <td>${renderAvatarHtml(st.PhotoFileID, (st.FirstName || '-')[0], 'avatar-mini')}</td> 
        <td>${fullName}<div class="text-secondary" style="font-size:.72rem">${st.StudentID}</div></td>
        <td>${st.StudentID}</td>
        <td>${st.Grade || '-'} / ${st.Room || '-'} เลขที่ ${st.No || '-'}</td>
        <td><span class="fw-bold" style="color:${st.CurrentScore < 70 ? 'var(--bad)' : 'var(--navy-900)'}">${st.CurrentScore}</span></td>
        <td>${st.LineLinked ? '<span class="badge-soft badge-good">เชื่อมแล้ว</span>' : '<span class="badge-soft badge-warn">ยังไม่เชื่อม</span>'}</td>
        <td class="text-end"><div class="action-btn-group">${actionBtns}</div></td>
      </tr>`;
    }).join('');
    document.getElementById('studentTableBody').innerHTML = rows || '<tr><td colspan="7" class="text-center text-secondary py-4">ไม่พบข้อมูลนักเรียน</td></tr>';
  }

  function updateEducationPhaseLabel() {
    const grade = document.getElementById('sm_grade').value;
    const phase = ['ม.1', 'ม.2', 'ม.3'].includes(grade) ? 'ม.ต้น' : 'ม.ปลาย';
    document.getElementById('sm_phaseLabel').value = phase;
  }

  function openAddStudentModal() {
  document.getElementById('studentModalTitle').textContent = 'เพิ่มนักเรียนใหม่';
  document.getElementById('sm_studentId').value = '';
  document.getElementById('sm_photoPreview').innerHTML = '-';
  document.getElementById('sm_photoInput').value = '';
  document.getElementById('sm_photoStatus').textContent = '';
  pendingPhotoBase64 = null; pendingPhotoMime = null; pendingPhotoExt = null;

    ['sm_firstName', 'sm_lastName', 'sm_room', 'sm_no', 'sm_citizenId', 'sm_dob', 'sm_bloodType', 'sm_weight', 'sm_height',
      'sm_addressNo', 'sm_addressMoo', 'sm_addressRoad', 'sm_addressTambon', 'sm_addressAmphoe', 'sm_addressProvince',
      'sm_parentName', 'sm_parentPhone', 'sm_parentJob', 'sm_fatherName', 'sm_fatherJob', 'sm_motherName', 'sm_motherJob'].forEach(id => {
        document.getElementById(id).value = '';
      });

    document.getElementById('sm_prefix').value = '';
    document.getElementById('sm_gender').value = '';
    document.getElementById('sm_grade').value = 'ม.1';
    document.getElementById('sm_parentRelation').value = 'บิดา';
    document.getElementById('sm_nationality').value = 'ไทย';
    document.getElementById('sm_religion').value = 'พุทธ';
    document.getElementById('sm_ethnicity').value = 'ไทย';

    updateEducationPhaseLabel();
    new bootstrap.Modal(document.getElementById('studentModal')).show();
  }

  function saveStudent() {
    const payload = {
      prefix: document.getElementById('sm_prefix').value,
      firstName: document.getElementById('sm_firstName').value.trim(),
      lastName: document.getElementById('sm_lastName').value.trim(),
      gender: document.getElementById('sm_gender').value,
      grade: document.getElementById('sm_grade').value,
      room: document.getElementById('sm_room').value.trim(),
      no: document.getElementById('sm_no').value,
      citizenId: document.getElementById('sm_citizenId').value.trim(),
      dob: document.getElementById('sm_dob').value,
      bloodType: document.getElementById('sm_bloodType').value,
      weight: document.getElementById('sm_weight').value,
      height: document.getElementById('sm_height').value,
      nationality: document.getElementById('sm_nationality').value,
      religion: document.getElementById('sm_religion').value,
      ethnicity: document.getElementById('sm_ethnicity').value,
      addressNo: document.getElementById('sm_addressNo').value,
      addressMoo: document.getElementById('sm_addressMoo').value,
      addressRoad: document.getElementById('sm_addressRoad').value,
      addressTambon: document.getElementById('sm_addressTambon').value,
      addressAmphoe: document.getElementById('sm_addressAmphoe').value,
      addressProvince: document.getElementById('sm_addressProvince').value,
      parentName: document.getElementById('sm_parentName').value.trim(),
      parentRelation: document.getElementById('sm_parentRelation').value,
      parentJob: document.getElementById('sm_parentJob').value.trim(),
      parentPhone: document.getElementById('sm_parentPhone').value.trim(),
      fatherName: document.getElementById('sm_fatherName').value,
      fatherJob: document.getElementById('sm_fatherJob').value,
      motherName: document.getElementById('sm_motherName').value,
      motherJob: document.getElementById('sm_motherJob').value
    };

    const requiredFields = [
      { key: 'prefix', label: 'คำนำหน้า' },
      { key: 'firstName', label: 'ชื่อ' },
      { key: 'lastName', label: 'นามสกุล' },
      { key: 'gender', label: 'เพศ' },
      { key: 'grade', label: 'ระดับชั้น' },
      { key: 'room', label: 'ห้อง' },
      { key: 'no', label: 'เลขที่' },
      { key: 'citizenId', label: 'เลขประจำตัวประชาชน' },
      { key: 'dob', label: 'วันเดือนปีเกิด' },
      { key: 'parentName', label: 'ชื่อ-นามสกุลผู้ปกครอง' },
      { key: 'parentPhone', label: 'เบอร์โทรศัพท์ผู้ปกครอง' }
    ];
    const missing = requiredFields.filter(f => !payload[f.key] || String(payload[f.key]).trim() === '');
    if (missing.length > 0) {
      Swal.fire({
        icon: 'warning',
        title: 'กรุณากรอกข้อมูลให้ครบ',
        html: 'ยังไม่ได้กรอก: <b>' + missing.map(f => f.label).join(', ') + '</b>'
      });
      return;
    }
    if (payload.citizenId.length !== 13 || !/^\d+$/.test(payload.citizenId)) {
      Swal.fire({ icon: 'warning', title: 'เลขประจำตัวประชาชนไม่ถูกต้อง', text: 'ต้องเป็นตัวเลข 13 หลัก' });
      return;
    }

    const editId = document.getElementById('sm_studentId').value;

    if (editId) {
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            uploadPendingPhoto(editId, () => {
              bootstrap.Modal.getInstance(document.getElementById('studentModal')).hide();
              Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
              openProfile(editId);
            });
          } else {
            Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: res.message });
          }
        })
        .withFailureHandler(err => Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message }))
        .apiUpdateStudent(getToken(), editId, payload);
    } else {
      google.script.run
        .withSuccessHandler(res => {
          if (res.success) {
            uploadPendingPhoto(res.studentId, () => {
              bootstrap.Modal.getInstance(document.getElementById('studentModal')).hide();
              Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', timer: 1500, showConfirmButton: false });
              loadStudents();
            });
          } else {
            Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: res.message });
          }
        })
        .withFailureHandler(err => Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message }))
        .apiAddStudent(getToken(), payload);
    }
  }

  /* ================= STUDENT PROFILE ================= */
  function openProfile(studentId) {
    currentStudentId = studentId;
    document.getElementById('profileContent').innerHTML = '<div class="text-center text-secondary py-5">กำลังโหลดข้อมูล...</div>';
    switchView('profile');

    google.script.run
      .withSuccessHandler(renderProfile)
      .withFailureHandler(err => Swal.fire({ icon: 'error', title: 'โหลดข้อมูลไม่สำเร็จ', text: err.message }))
      .apiGetStudentDetail(getToken(), studentId);
  }

      document.getElementById('profileContent').innerHTML = `<div class="alert alert-danger">${res.message}</div>`;
      return;
    }
    const st = res.student;
    const parent = res.parent || {};
    const timeline = res.timeline || [];

    const actionsEl = document.getElementById('profileActions');
    const canScore = currentUser && currentUser.permissions && currentUser.permissions.score;
    const canManage = currentUser && currentUser.permissions && currentUser.permissions.editDelete;
    let actionBtns = '';
    if (canScore) {
      actionBtns += `<button class="btn btn-sm btn-gold" onclick="openScoreForStudent('${st.StudentID}','${st.Prefix||''}','${st.FirstName||''}','${st.LastName||''}','${st.Grade||''}','${st.Room||''}',${st.CurrentScore},'${st.EducationPhase||''}')"><i class="bi bi-award me-1"></i> บันทึกคะแนน</button>`;
    }
    if (canManage) {
      actionBtns += `<button class="btn btn-sm btn-navy" onclick="openEditStudentModal('${st.StudentID}')"><i class="bi bi-pencil-square me-1"></i> แก้ไข</button>
        <button class="btn btn-sm btn-outline-danger" onclick="deleteStudent('${st.StudentID}')"><i class="bi bi-trash3 me-1"></i> ลบ</button>`;
    }
    actionsEl.innerHTML = actionBtns ? `<div class="d-flex gap-2">${actionBtns}</div>` : '';

    const eventIcon = { create: 'bi-plus-circle', add: 'bi-plus', deduct: 'bi-dash', invite: 'bi-envelope', leave: 'bi-door-open', line: 'bi-line' };
    const eventColor = { create: 'var(--navy-800)', add: 'var(--good)', deduct: 'var(--bad)', invite: 'var(--warn)', leave: 'var(--navy-800)', line: '#06C755' };

    document.getElementById('profileContent').innerHTML = `
  <div class="row g-3">
    <div class="col-lg-4">
      <div class="card-panel text-center">
        ${renderAvatarHtml(st.PhotoFileID, (st.FirstName || '-')[0] + (st.LastName || '-')[0], 'avatar-lg mx-auto mb-3')}
        <h4 class="mb-0">${st.Prefix || ''}${st.FirstName || ''} ${st.LastName || ''}</h4>
        <div class="text-secondary small mb-3">${st.StudentID} · ${st.Grade}/${st.Room} เลขที่ ${st.No}</div>
        <div class="score-pill mb-0" style="color:${st.CurrentScore < 70 ? 'var(--bad)' : 'var(--navy-900)'}">${st.CurrentScore}</div>
        <div class="text-secondary small mb-3">คะแนนความประพฤติคงเหลือ (${st.EducationPhase})</div>
        <div class="text-start small">
          <div class="d-flex justify-content-between border-bottom py-1"><span class="text-secondary">เพศ</span><span>${st.Gender || '-'}</span></div>
          <div class="d-flex justify-content-between border-bottom py-1"><span class="text-secondary">วันเกิด</span><span>${st.DOB ? toThaiDate(st.DOB) : '-'}</span></div>
          <div class="d-flex justify-content-between border-bottom py-1"><span class="text-secondary">เลขบัตร ปชช.</span><span>${st.CitizenID || '-'}</span></div>
          <div class="d-flex justify-content-between border-bottom py-1"><span class="text-secondary">หมู่เลือด</span><span>${st.BloodType || '-'}</span></div>
          <div class="d-flex justify-content-between border-bottom py-1"><span class="text-secondary">น้ำหนัก / ส่วนสูง</span><span>${st.Weight || '-'} กก. / ${st.Height || '-'} ซม.</span></div>
          <div class="d-flex justify-content-between border-bottom py-1"><span class="text-secondary">ศาสนา</span><span>${st.Religion || '-'}</span></div>
          <div class="d-flex justify-content-between border-bottom py-1"><span class="text-secondary">เชื้อชาติ / สัญชาติ</span><span>${st.Ethnicity || '-'} / ${st.Nationality || '-'}</span></div>
          <div class="d-flex justify-content-between py-1"><span class="text-secondary">สถานะ LINE</span><span>${st.LineLinked ? 'เชื่อมแล้ว ✅' : 'ยังไม่เชื่อม'}</span></div>
        </div>

      <div class="card-panel mt-3">

            ? `<div class="py-1">${[st.Address_No ? 'บ้านเลขที่ ' + st.Address_No : '', st.Address_Moo ? 'หมู่ ' + st.Address_Moo : '', st.Address_Road ? 'ถ. ' + st.Address_Road : ''].filter(Boolean).join(' ')}</div>
              <div class="py-1">${['ต. ' + (st.Address_Tambon || '-'), 'อ. ' + (st.Address_Amphoe || '-'), 'จ. ' + (st.Address_Province || '-')].join(' ')}</div>`
            : '<div class="text-secondary">ไม่มีข้อมูลที่อยู่</div>'}
        </div>
      </div>

      <div class="card-panel mt-3">
        <div class="section-title"><span class="bar"></span> ข้อมูลผู้ปกครอง</div>
        <div class="small">
          <div class="d-flex justify-content-between border-bottom py-1"><span class="text-secondary">ผู้ปกครอง</span><span>${parent.ParentName || '-'} (${parent.ParentRelation || '-'})</span></div>
          <div class="d-flex justify-content-between border-bottom py-1"><span class="text-secondary">อาชีพ</span><span>${parent.ParentJob || '-'}</span></div>

          <div class="d-flex justify-content-between border-bottom py-1"><span class="text-secondary">บิดา</span><span>${parent.FatherName || '-'} · ${parent.FatherJob || '-'}</span></div>
          <div class="d-flex justify-content-between py-1"><span class="text-secondary">มารดา</span><span>${parent.MotherName || '-'} · ${parent.MotherJob || '-'}</span></div>

    <div class="col-lg-8">
      <div class="card-panel">
        <div class="section-title"><span class="bar"></span> ไทม์ไลน์นักเรียน</div>
        <div class="timeline">
          ${timeline.length ? timeline.map(ev => `
            <div class="tl-item">
              <div class="tl-dot" style="background:${eventColor[ev.EventType] || 'var(--navy-800)'}"><i class="bi ${eventIcon[ev.EventType] || 'bi-dot'}"></i></div>
              <div class="tl-time">${toThaiDate(ev.Timestamp, true)}</div>
              <div class="tl-title">${ev.Title}</div>

  /* ================= EDIT STUDENT ================= */
  function openEditStudentModal(studentId) {
    Swal.fire({ title: 'กำลังโหลดข้อมูล...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

    google.script.run
      .withSuccessHandler(function (res) {
        Swal.close();
        if (!res.success) {
          Swal.fire({ icon: 'error', title: 'โหลดข้อมูลไม่สำเร็จ', text: res.message });
          return;
        }
        const st = res.student;
        const p = res.parent || {};

  function submitScore() {
    if (!selectedScoreStudent) {
      Swal.fire({ icon: 'warning', title: 'กรุณาเลือกนักเรียนก่อน' });
      return;
    }
    const amount = parseInt(document.getElementById('scoreAmount').value) || 0;
    const reason = document.getElementById('scoreReasonText').value.trim();
    if (amount <= 0) {
      Swal.fire({ icon: 'warning', title: 'กรุณาระบุจำนวนคะแนนให้ถูกต้อง' });
      return;
    }
    if (!reason) {
      Swal.fire({ icon: 'warning', title: 'กรุณาระบุเหตุผล' });
      return;
    }

    Swal.fire({
      icon: 'question',
      title: scoreType === 'add' ? `เพิ่มคะแนน ${amount} คะแนน?` : `ลดคะแนน ${amount} คะแนน?`,
      text: `${selectedScoreStudent.Prefix || ''}${selectedScoreStudent.FirstName} ${selectedScoreStudent.LastName} — เหตุผล: ${reason}`,
      showCancelButton: true,
      confirmButtonText: 'ยืนยันบันทึก',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: scoreType === 'add' ? '#1f8a5b' : '#c2483a'
    }).then(r => {
      if (!r.isConfirmed) return;

      google.script.run
        .withSuccessHandler(res => {
          if (!res.success) {
            Swal.fire({ icon: 'error', title: 'บันทึกไม่สำเร็จ', text: res.message });
            return;
          }
          let msg = `คะแนนคงเหลือ: ${res.newScore} คะแนน`;
          if (res.alertTriggered !== null && res.alertTriggered !== undefined) {
            msg += `\n⚠️ คะแนนลดถึงเกณฑ์ ${res.alertTriggered} คะแนน — ควรเชิญผู้ปกครอง`;
          }
          Swal.fire({ icon: 'success', title: 'บันทึกสำเร็จ', text: msg, timer: 2800, showConfirmButton: false });

          document.getElementById('scoreReasonText').value = '';
          document.getElementById('scoreReasonPreset').value = '';
          clearScoreStudent();
          loadScoreHistory();
        })
        .withFailureHandler(err => Swal.fire({ icon: 'error', title: 'เกิดข้อผิดพลาด', text: err.message }))
        .apiAddScore(getToken(), {
          studentId: selectedScoreStudent.StudentID,
          type: scoreType,
          amount: amount,
          reason: reason
        });
    });
  }

  function loadLeaveRequests() {
    document.getElementById('leaveTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">กำลังโหลด...</td></tr>';

    google.script.run
      .withSuccessHandler(res => {
        if (!res.success) {
          document.getElementById('leaveTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">โหลดข้อมูลไม่สำเร็จ</td></tr>';
          return;
        }
        document.getElementById('leavePendingBadge').textContent = res.pendingCount;
        document.getElementById('leaveApprovedBadge').textContent = res.approvedCount;
        document.getElementById('leaveRejectedBadge').textContent = res.rejectedCount;
        document.getElementById('leaveAllBadge').textContent = res.totalCount;

        const canApprove = currentUser && currentUser.permissions && currentUser.permissions.approveLeave;

        const rows = res.requests.map(r => {
          const statusBadge = r.Status === 'pending' ? '<span class="badge-soft badge-warn">รอดำเนินการ</span>'
            : r.Status === 'approved' ? '<span class="badge-soft badge-good">อนุมัติแล้ว</span>'
            : '<span class="badge-soft badge-bad">ไม่อนุมัติ</span>';

          const actionBtns = (r.Status === 'pending' && canApprove) ? `
            <button class="btn btn-sm btn-outline-success me-1" onclick="handleLeaveAction('${r.RequestID}','approved')"><i class="bi bi-check-lg"></i></button>
            <button class="btn btn-sm btn-outline-danger" onclick="handleLeaveAction('${r.RequestID}','rejected')"><i class="bi bi-x-lg"></i></button>`
            : '<span class="text-secondary small">—</span>';

          return `
          <tr>
            <td>${r.StudentName}<div class="text-secondary" style="font-size:.72rem">${r.StudentClass}</div></td>
            <td class="text-secondary small">${r.Reason}</td>
            <td class="small">ออก ${formatTimeDisplay(r.RequestedOutTime)} น. · กลับ ${formatTimeDisplay(r.RequestedInTime)} น.</td>
            <td>${statusBadge}</td>
            <td class="text-end">${actionBtns}</td>
          </tr>`;
        }).join('');

        document.getElementById('leaveTableBody').innerHTML = rows || '<tr><td colspan="5" class="text-center text-secondary py-4">ไม่มีรายการ</td></tr>';
      })
      .withFailureHandler(() => {
        document.getElementById('leaveTableBody').innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">โหลดข้อมูลไม่สำเร็จ</td></tr>';
      })
      .apiGetLeaveRequests(getToken(), { status: currentLeaveTab });
  }

  function handleLeaveAction(requestId, status) {
    Swal.fire({
      icon: status === 'approved' ? 'question' : 'warning',
      title: status === 'approved' ? 'อนุมัติคำร้องนี้?' : 'ไม่อนุมัติคำร้องนี้?',
      input: 'text',
      inputLabel: 'ระบุเหตุผล (ถ้ามี)',
      inputPlaceholder: 'เช่น เอกสารไม่ครบ',
      showCancelButton: true,
      confirmButtonText: 'ยืนยัน',
      cancelButtonText: 'ยกเลิก',
      confirmButtonColor: status === 'approved' ? '#1f8a5b' : '#c2483a'
    }).then(r => {

let pendingPhotoBase64 = null;
let pendingPhotoMime = null;
let pendingPhotoExt = null;

function handlePhotoSelect(e) {
  const file = e.target.files[0];
  if (!file) return;

  if (!['image/jpeg', 'image/png'].includes(file.type)) {
    Swal.fire({ icon: 'warning', title: 'ชนิดไฟล์ไม่ถูกต้อง', text: 'รองรับเฉพาะ .jpg และ .png เท่านั้น' });
    e.target.value = '';
    return;
  }
  if (file.size > 5 * 1024 * 1024) {
    Swal.fire({ icon: 'warning', title: 'ไฟล์ใหญ่เกินไป', text: 'ขนาดไฟล์ต้องไม่เกิน 5MB' });
    e.target.value = '';
    return;
  }

  document.getElementById('sm_photoStatus').textContent = 'กำลังบีบอัดรูปภาพ...';

  compressImageToUnder1MB(file).then(result => {
    pendingPhotoBase64 = result.base64;
    pendingPhotoMime = result.mimeType;
    pendingPhotoExt = result.mimeType === 'image/png' ? 'png' : 'jpg';

    const preview = document.getElementById('sm_photoPreview');
    preview.innerHTML = `<img src="data:${result.mimeType};base64,${result.base64}" style="width:100%;height:100%;object-fit:cover;">`;
    document.getElementById('sm_photoStatus').textContent = `พร้อมอัปโหลด (ขนาดหลังบีบอัด ${(result.sizeBytes / 1024).toFixed(0)} KB)`;
  }).catch(err => {
    Swal.fire({ icon: 'error', title: 'บีบอัดรูปไม่สำเร็จ', text: err.message });
    document.getElementById('sm_photoStatus').textContent = '';
  });
}

/**
 * บีบอัดรูปด้วย canvas ให้เหลือไม่เกิน 1MB โดยลดคุณภาพ/ขนาดลงเรื่อยๆ
 */
function compressImageToUnder1MB(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = function (evt) {
      const img = new Image();
      img.onload = function () {
        let width = img.width;
        let height = img.height;
        const maxDim = 1600;
        if (width > maxDim || height > maxDim) {
          const ratio = Math.min(maxDim / width, maxDim / height);
          width = Math.round(width * ratio);
          height = Math.round(height * ratio);
        }

        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        const targetBytes = 1 * 1024 * 1024;
        let quality = 0.9;
        const mimeType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';

        function tryCompress() {
          const dataUrl = canvas.toDataURL(mimeType === 'image/png' ? 'image/png' : 'image/jpeg', quality);
          const base64 = dataUrl.split(',')[1];
          const sizeBytes = Math.ceil(base64.length * 3 / 4);

          if (sizeBytes <= targetBytes || quality <= 0.3) {
            resolve({ base64: base64, mimeType: mimeType === 'image/png' && sizeBytes <= targetBytes ? 'image/png' : 'image/jpeg', sizeBytes: sizeBytes });
          } else {
            quality -= 0.1;
            tryCompress();
          }
        }
        tryCompress();
      };
      img.onerror = () => reject(new Error('ไม่สามารถอ่านไฟล์รูปภาพได้'));
      img.src = evt.target.result;
    };
    reader.onerror = () => reject(new Error('ไม่สามารถอ่านไฟล์ได้'));
    reader.readAsDataURL(file);
  });
}

function uploadPendingPhoto(studentId, onDone) {
  if (!pendingPhotoBase64) { onDone(); return; }
  google.script.run
    .withSuccessHandler(res => {
      pendingPhotoBase64 = null; pendingPhotoMime = null; pendingPhotoExt = null;
      onDone();
    })
    .withFailureHandler(err => {
      Swal.fire({ icon: 'warning', title: 'บันทึกข้อมูลสำเร็จ แต่อัปโหลดรูปไม่สำเร็จ', text: err.message });
      onDone();
    })
    .apiUploadStudentPhoto(getToken(), studentId, pendingPhotoBase64, pendingPhotoMime, pendingPhotoExt);
}

/**
 * Helper: คืน HTML avatar — แสดงรูปจริงถ้ามี PhotoFileID, ไม่งั้นแสดงตัวอักษรย่อ
 */
function renderAvatarHtml(photoFileId, initial, sizeClass) {
  sizeClass = sizeClass || 'avatar-mini';
  if (photoFileId) {
    const url = getDriveThumbnailUrl_(photoFileId);
    return `<div class="${sizeClass}" style="overflow:hidden;padding:0;"><img src="${url}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='${initial}'; this.parentElement.style.background='#eef1f8'; this.parentElement.style.color='var(--navy-800)';"></div>`;
  }
  return `<div class="${sizeClass}" style="background:#eef1f8;color:var(--navy-800)">${initial}</div>`;
}

// ประกอบ URL แยกส่วน เพื่อให้ HTML Service ไม่ตัดข้อความหลัง "https:"
function getDriveFileUrl_(fileId) {
  return 'https:' + '/' + '/' + 'drive.google.com/file/d/' + fileId + '/view';
}

function getDriveThumbnailUrl_(fileId) {
  return 'https:' + '/' + '/' + 'drive.google.com/thumbnail?id=' + fileId + '&sz=w200';
}
